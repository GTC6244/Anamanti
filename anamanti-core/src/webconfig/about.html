<p class="sub">The running Anamanti Core build — use this to confirm what's deployed.</p>

<div class="card">
  <h2><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7L12 12l8.7-5M12 22V12"/></svg>Build</h2>
  <p class="desc">Version and provenance of the binary currently serving this page.</p>
  <table><tbody id="about_rows">
    <tr><td class="muted">Loading…</td></tr>
  </tbody></table>
</div>

<script>
async function load(){
  const tb = document.getElementById('about_rows');
  try {
    const d = await getJSON('/about.json');
    const cell = v => (v == null || v === '') ? '—' : esc(v);
    tb.innerHTML =
      '<tr><th>Version</th><td>' + cell(d.version) + '</td></tr>' +
      '<tr><th>Git branch</th><td>' + cell(d.git_branch) + '</td></tr>' +
      '<tr><th>Git commit</th><td><code>' + cell(d.git_sha) + '</code></td></tr>' +
      '<tr><th>Built (UTC)</th><td>' + cell(d.build_time) + '</td></tr>' +
      '<tr><th>Drive support</th><td>yes — Photos tab + <code>ambient-get-drive-token</code></td></tr>';
  } catch (e) {
    tb.innerHTML = '<tr><td class="err">Failed to load build metadata: ' + esc(e) + '</td></tr>';
  }
}
load();
</script>
