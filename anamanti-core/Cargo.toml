[package]
name = "anamanti_core"
version = "0.1.0"
edition = "2021"
description = "Mac Mini assistant pipeline (STT -> pluggable LLM + persistent memory -> Piper TTS) for the Anamanti voice assistant (Plan.MD Phase 4)."

[[bin]]
name = "anamanti-core"
path = "src/main.rs"

# Live streaming smoke test for the rig LLM path (real Ollama, optional web
# search): `cargo run --example rig_smoke`. rig-core is always compiled in, so this
# needs no feature gate.
[[example]]
name = "rig_smoke"

# Host-side AEC spike (WebRTC APM). Reads raw 16 kHz mono i16 PCM dumps of the
# device mic (near-end) and render reference (far-end), runs them through the
# APM, and writes the cleaned mic out. Built only with the `aec` feature:
# `cargo run --features aec --example aec_spike -- mic.pcm ref.pcm clean.pcm`.
[[example]]
name = "aec_spike"
required-features = ["aec"]

[features]
# The embedded HelixDB GraphRAG memory backend (deps `db`/`helix-ast`), the
# rig-core agent framework (`rig-core`, powering the LLM tool/web-search path), and
# the ECAPA-TDNN ONNX voiceprint embedder (pure-Rust `tract-onnx`; speaker_id_plan.md
# Phase E) are ALWAYS compiled in — they are no longer feature-gated. Speaker ID is
# selected purely at runtime from the JSON config: `speaker.enabled` turns the
# per-person pipeline on, and `speaker.model_path` chooses the real ONNX embedder
# (a missing path degrades to the deterministic mock embedder). `aec` stays opt-in
# below because it triggers a heavy native C++ build.
# `aec` compiles the host-side WebRTC Audio Processing stage (AEC3 + noise
# suppression + AGC). Off by default because it triggers a heavy native C++ build
# (vendored libwebrtc via meson/ninja + abseil) — build prerequisites: `meson`,
# `ninja`, `pkg-config`, and the `llvm-tools` rustup component (for `rust-objcopy`).
# See the Phase 0 spike + `src/aec/mod.rs`.
aec = ["dep:webrtc-audio-processing"]

# `stt-whisper-local` compiles the in-process Whisper STT engine (whisper.cpp via
# `whisper-rs`), replacing the out-of-process `wyoming-faster-whisper` Python server
# (see `plans/python-to-rust-whisper.md`). Off by default because it triggers a heavy
# native build (whisper.cpp/ggml via cmake + a C/C++ toolchain). CPU-only here;
# CoreML/Metal acceleration are separate whisper-rs features wired in a later stage.
stt-whisper-local = ["dep:whisper-rs"]

# Acceleration variants, additive over `stt-whisper-local`. `metal` runs whisper.cpp
# on the Apple GPU — a pure build flag, no extra model assets — and is the
# recommended accel on the M4. `coreml` runs the encoder on the ANE but requires a
# separately generated CoreML encoder model (`*-encoder.mlmodelc`), which today is
# produced by a Python (torch/coremltools) conversion step — re-introducing a Python
# build dependency this project is otherwise removing — so it is offered but not the
# default recommendation. See `plans/python-to-rust-whisper.md` (Stage 4).
stt-whisper-metal = ["stt-whisper-local", "whisper-rs/metal"]
stt-whisper-coreml = ["stt-whisper-local", "whisper-rs/coreml"]

[dependencies]
# Embedded HelixDB engine (always compiled). Pinned to the spike-verified commit.
db = { git = "https://github.com/HelixDB/helix-db.git", package = "db", rev = "6fde5bc8e3ceb7624124ad18d2ef6ef0bc5d60ff" }
helix-ast = { git = "https://github.com/HelixDB/helix-db.git", package = "helix-ast", rev = "6fde5bc8e3ceb7624124ad18d2ef6ef0bc5d60ff" }
anyhow = "1.0.104"
async-stream = "0.3"
async-trait = "0.1"
# Google Drive OAuth consent (PKCE): base64url verifier/challenge, SHA-256
# challenge, CSPRNG for the verifier, and URL building for the auth request.
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
url = "2"
bytes = "1"
# Local (timezone-aware) wall-clock time, injected into the LLM prompt each turn so
# the model answers date/time questions from fact. `clock` enables `Local::now()` +
# the system timezone; default features are off to keep the build lean.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Timezone database for resolving `TZID=…` datetimes in iCalendar feeds (aligned
# with the version `rrule` pulls, so their `chrono_tz::Tz` types unify).
chrono-tz = "0.10"
env_logger = "0.11"
# Read-only iCalendar (.ics) parsing for web-subscription calendars: `ical` parses
# VEVENTs, `rrule` expands recurring events (RRULE) within a query window.
ical = "0.11"
rrule = "0.14"
futures-util = "0.3"
log = "0.4.34"
mdns-sd = "0.11"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
# rig-core agent framework (always compiled) — powers the LLM tool / web-search path.
rig-core = "0.42"
rusqlite = { version = "0.31", features = ["bundled"] }
# Pure-Rust ONNX inference for the ECAPA-TDNN speaker embedder (always compiled;
# gated at runtime by speaker.model_path). No external onnxruntime binary — compiles
# offline.
tract-onnx = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.34", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "sync",
    "time",
    "macros",
    "signal",
    "process",
] }
# Host-side WebRTC Audio Processing (feature `aec`). `bundled` statically builds
# the vendored libwebrtc APM (meson/ninja + abseil) so no system lib is required;
# see the `aec` feature note above for the host build prerequisites.
webrtc-audio-processing = { version = "2.1", features = [
    "bundled",
], optional = true }
# In-process Whisper STT (feature `stt-whisper-local`). whisper.cpp bindings; builds
# the vendored whisper.cpp/ggml from source (cmake + C/C++ toolchain). CPU-only:
# default-features are off so no GPU/accel backend is pulled here.
whisper-rs = { version = "0.14", default-features = false, optional = true }

[dev-dependencies]
tokio = { version = "1.34", features = ["test-util"] }
# WAV fixture parsing for the in-process Whisper integration test (pure Rust).
hound = "3.5"
