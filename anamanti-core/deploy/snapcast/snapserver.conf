# snapserver configuration for the Anamanti house-wide music routing (Mac host).
# See plans/snapcast_routing_plan.md. snapserver runs ON THE MAC (the always-on
# hub); the Linux main speaker + rooms + (optionally) the Echo Show are snapclients.
#
# snapserver LAUNCHES BOTH PLAYERS ITSELF and reads their PCM from stdout over an
# anonymous pipe:
#   * Spotify  — librespot (Spotify Connect device "Ambient")   librespot:// source
#   * Web      — mpv, idle until the Core loads a URL over IPC   process://   source
# The Anamanti Core never touches PCM; it only issues snapserver JSON-RPC on :1705 and
# mpv IPC commands on /tmp/ambient-mpv.sock (radio play/stop/volume/ICY title).
#
# WHY NOT NAMED FIFOs (pipe://): on macOS snapserver's FIFO reader stalls. With no
# writer attached it loops open → EOF → close → reopen every 100 ms, which trips the
# macOS kqueue FIFO bugs: its read never wakes, the writer (mpv) fills the pipe and
# blocks forever in write(), and nothing plays (2026-10-15; the Web stream had never
# once reached "playing" on the Mac). Anonymous stdout pipes don't have the problem.
# Keep `music.players_in_snapserver` (default true) in anamanti.json in step with this
# file: it stops the Core from also spawning mpv/librespot.
#
# If the `devicename` below changes, change `music.spotify_device_name` to match. The
# librespot cache keeps the Spotify Connect credentials across restarts.
#
# Volume: librespot is left on its default curve (`--volume-ctrl log --volume-range 60`).
# The Core maps the radio's (mpv's) volume onto that same curve
# (`music::MUSIC_VOLUME_RANGE_DB`), so a given percent is equally loud on Spotify and
# radio. If you add a different volume-ctrl/range here, change that constant to match.

[stream]
source = librespot:///opt/homebrew/bin/librespot?name=Spotify&devicename=Ambient&bitrate=320&volume=100&cache=/opt/homebrew/var/run/ambient/librespot-cache&disable_audio_cache=true&codec=flac
# mpv must emit exactly the declared sampleformat (raw s16le 48 kHz stereo, no WAV
# header) and print nothing else to stdout (--no-terminal); its log goes to --log-file.
source = process:///opt/homebrew/bin/mpv?name=Web&sampleformat=48000:16:2&codec=flac&params=--idle=yes%20--no-terminal%20--no-video%20--input-ipc-server=/tmp/ambient-mpv.sock%20--log-file=/opt/homebrew/var/log/ambient-mpv-web.log%20--ao=pcm%20--ao-pcm-waveheader=no%20--ao-pcm-file=/dev/stdout%20--audio-samplerate=48000%20--audio-channels=stereo%20--audio-format=s16

# Client-facing stream defaults.
sampleformat = 48000:16:2
codec = flac
# ~1 s end-to-end buffer (accepted per the plan). Lower for tighter sync at the
# cost of robustness.
buffer = 1000
chunk_ms = 20

[http]
enabled = true
bind_to_address = 0.0.0.0
port = 1780
# doc_root =   # set to the snapweb dir if you want the built-in web UI

[tcp]
# The JSON-RPC control API the Core's ducker talks to
# (music.snapserver_addr, default 127.0.0.1:1705).
enabled = true
bind_to_address = 0.0.0.0
port = 1705

[logging]
# sink = file:/opt/homebrew/var/log/snapserver.log
