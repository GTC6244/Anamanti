# snapserver configuration for the Ambient house-wide music routing (Mac host).
# See plans/snapcast_routing_plan.md. snapserver runs ON THE MAC (the always-on
# hub); the Linux main speaker + rooms + (optionally) the Echo Show are snapclients.
#
# Two pipe sources, each a named FIFO an external sibling process writes raw PCM to:
#   * Spotify  — librespot (Spotify Connect device "Ambient")  → snap-spotify
#   * Web      — mpv/ffmpeg decoding a URL                       → snap-web
# The orchestrator NEVER writes these; it only issues JSON-RPC control on :1705.
#
# NOTE (validate at P1/P3 bring-up): librespot emits 44100:16:2; the web player
# must be configured to emit exactly the declared sampleformat below. snapserver
# resamples each stream to the client format, so mixed source rates are fine.

[stream]
# Adjust the FIFO paths to match setup-mac.sh (default: /opt/homebrew/var/run/ambient).
source = pipe:///opt/homebrew/var/run/ambient/snap-spotify?name=Spotify&sampleformat=44100:16:2&codec=flac
source = pipe:///opt/homebrew/var/run/ambient/snap-web?name=Web&sampleformat=48000:16:2&codec=flac

# Client-facing stream defaults.
sampleformat = 48000:16:2
codec = flac
# ~1 s end-to-end buffer (accepted per the plan). Lower for tighter sync at the
# cost of robustness.
buffer = 1000
chunk_ms = 20

[http]
enabled = true
bind_to_address = 0.0.0.0
port = 1780
# doc_root =   # set to the snapweb dir if you want the built-in web UI

[tcp]
# The JSON-RPC control API the orchestrator's ducker talks to
# (music.snapserver_addr, default 127.0.0.1:1705).
enabled = true
bind_to_address = 0.0.0.0
port = 1705

[logging]
# sink = file:/opt/homebrew/var/log/snapserver.log
