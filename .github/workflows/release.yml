name: Release APK

# Publishes a signed universal release APK to GitHub Releases whenever you push a
# version tag (e.g. `v1.0.1`). Obtainium on each Echo Show polls this repo's
# releases and installs the new APK automatically.
#
# One-time setup (see the setup notes in the PR / chat):
#   - Generate a release keystore and store it as repo secrets:
#       ANDROID_KEYSTORE_BASE64   (base64 of your .jks)
#       ANDROID_KEYSTORE_PASSWORD
#       ANDROID_KEY_ALIAS
#       ANDROID_KEY_PASSWORD
#
# Release flow each time:
#   1. Bump `version:` in pubspec.yaml (e.g. 1.0.0+1 -> 1.0.1+2). The `+N` build
#      number is the Android versionCode and MUST increase every release.
#   2. git commit + push
#   3. git tag v1.0.1 && git push origin v1.0.1   ->   this workflow runs.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write # needed to create the GitHub Release

env:
  # If the build fails complaining about a different NDK version, set this to the
  # version Flutter asks for and it will be installed below.
  NDK_VERSION: "27.0.12077973"

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust (for the cargokit / flutter_rust_bridge build)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/android/app/upload-keystore.jks"

      - name: Sanity-check tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PUBSPEC_VERSION="$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f1)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "pubspec version: $PUBSPEC_VERSION   tag: $TAG_VERSION"
          if [ "$PUBSPEC_VERSION" != "$TAG_VERSION" ]; then
            echo "::warning::Tag ($TAG_VERSION) does not match pubspec version ($PUBSPEC_VERSION). Obtainium uses the APK's embedded version, so make sure you bumped pubspec.yaml."
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Rename APK with version
        id: apk
        run: |
          VERSION="$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//')"
          SRC="build/app/outputs/flutter-apk/app-release.apk"
          OUT="EasyHome-${VERSION}.apk"
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          fail_on_unmatched_files: true
