name: Bug report
description: Something isn't working as expected.
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Display app (Echo Show)
        - Anamanti Core (Mac)
        - Companion app (phone)
        - Website
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: App or Core version, if you know it.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Any relevant log output. Remove anything private (addresses, API keys, names) first.
      render: text
