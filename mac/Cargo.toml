[package]
name = "ambient_orchestrator"
version = "0.1.0"
edition = "2021"
description = "Mac Mini assistant pipeline (STT -> pluggable LLM + persistent memory -> Piper TTS) for the Ambient Smart Display voice assistant (Plan.MD Phase 4)."

[[bin]]
name = "ambient-orchestrator"
path = "src/main.rs"

# Live streaming smoke test for the rig LLM path (real Ollama, optional web
# search). Built only with the `rig` feature: `cargo run --example rig_smoke`.
[[example]]
name = "rig_smoke"
required-features = ["rig"]

[features]
# `helix` compiles the embedded HelixDB GraphRAG memory backend directly into the
# orchestrator (git dependency on HelixDB's engine crate — no server, no Docker;
# see memory_plan.md "SPIKE RESULT"). On by default; the SQLite backend is always
# available regardless. Disable with `--no-default-features` for a lean build that
# skips the heavy engine deps (slatedb/tantivy/foyer, ~90s cold compile).
default = ["helix"]
helix = ["dep:db", "dep:helix-ast"]
# `rig` routes the LLM backends through the rig-core agent framework instead of the
# hand-rolled HTTP clients. Opt-in during the migration; select at runtime with
# AMBIENT_LLM_ENGINE=rig. Off by default until it reaches parity.
rig = ["dep:rig-core"]

[dependencies]
# Embedded HelixDB engine (feature `helix`). Pinned to the spike-verified commit.
db = { git = "https://github.com/HelixDB/helix-db.git", package = "db", rev = "6fde5bc8e3ceb7624124ad18d2ef6ef0bc5d60ff", optional = true }
helix-ast = { git = "https://github.com/HelixDB/helix-db.git", package = "helix-ast", rev = "6fde5bc8e3ceb7624124ad18d2ef6ef0bc5d60ff", optional = true }
anyhow = "1.0.104"
async-stream = "0.3"
async-trait = "0.1"
bytes = "1"
# Local (timezone-aware) wall-clock time, injected into the LLM prompt each turn so
# the model answers date/time questions from fact. `clock` enables `Local::now()` +
# the system timezone; default features are off to keep the build lean.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
env_logger = "0.11"
futures-util = "0.3"
log = "0.4.34"
mdns-sd = "0.11"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
rig-core = { version = "0.42", optional = true }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.34", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "sync",
    "time",
    "macros",
    "signal",
] }

[dev-dependencies]
tokio = { version = "1.34", features = ["test-util"] }
