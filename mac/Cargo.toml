[package]
name = "ambient_orchestrator"
version = "0.1.0"
edition = "2021"
description = "Mac Mini assistant pipeline (STT -> pluggable LLM + persistent memory -> Piper TTS) for the Ambient Smart Display voice assistant (Plan.MD Phase 4)."

[[bin]]
name = "ambient-orchestrator"
path = "src/main.rs"

# Live streaming smoke test for the rig LLM path (real Ollama, optional web
# search). Built only with the `rig` feature: `cargo run --example rig_smoke`.
[[example]]
name = "rig_smoke"
required-features = ["rig"]

# Host-side AEC spike (WebRTC APM). Reads raw 16 kHz mono i16 PCM dumps of the
# device mic (near-end) and render reference (far-end), runs them through the
# APM, and writes the cleaned mic out. Built only with the `aec` feature:
# `cargo run --features aec --example aec_spike -- mic.pcm ref.pcm clean.pcm`.
[[example]]
name = "aec_spike"
required-features = ["aec"]

[features]
# The embedded HelixDB GraphRAG memory backend (deps `db`/`helix-ast`) and the
# rig-core agent framework (`rig-core`, powering the LLM tool/web-search path) are
# ALWAYS compiled in — they are no longer feature-gated. `speaker` and `aec` stay
# opt-in below because they trigger heavy native builds.
# `speaker` compiles the real ECAPA-TDNN ONNX voiceprint embedder (pure-Rust
# `tract-onnx`, no external runtime; speaker_id_plan.md Phase E). Off by default;
# the deterministic mock embedder + the whole per-person pipeline work without it.
# Enable with `--features speaker` and set AMBIENT_SPEAKER_MODEL_PATH to the model.
speaker = ["dep:tract-onnx"]
# `aec` compiles the host-side WebRTC Audio Processing stage (AEC3 + noise
# suppression + AGC). Off by default because it triggers a heavy native C++ build
# (vendored libwebrtc via meson/ninja + abseil) — build prerequisites: `meson`,
# `ninja`, `pkg-config`, and the `llvm-tools` rustup component (for `rust-objcopy`).
# See the Phase 0 spike + `src/aec/mod.rs`.
aec = ["dep:webrtc-audio-processing"]

[dependencies]
# Embedded HelixDB engine (always compiled). Pinned to the spike-verified commit.
db = { git = "https://github.com/HelixDB/helix-db.git", package = "db", rev = "6fde5bc8e3ceb7624124ad18d2ef6ef0bc5d60ff" }
helix-ast = { git = "https://github.com/HelixDB/helix-db.git", package = "helix-ast", rev = "6fde5bc8e3ceb7624124ad18d2ef6ef0bc5d60ff" }
anyhow = "1.0.104"
async-stream = "0.3"
async-trait = "0.1"
bytes = "1"
# Local (timezone-aware) wall-clock time, injected into the LLM prompt each turn so
# the model answers date/time questions from fact. `clock` enables `Local::now()` +
# the system timezone; default features are off to keep the build lean.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
env_logger = "0.11"
futures-util = "0.3"
log = "0.4.34"
mdns-sd = "0.11"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
# rig-core agent framework (always compiled) — powers the LLM tool / web-search path.
rig-core = "0.42"
rusqlite = { version = "0.31", features = ["bundled"] }
# Pure-Rust ONNX inference for the speaker embedder (feature `speaker`). No
# external onnxruntime binary — compiles offline.
tract-onnx = { version = "0.21", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.34", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "sync",
    "time",
    "macros",
    "signal",
] }
# Host-side WebRTC Audio Processing (feature `aec`). `bundled` statically builds
# the vendored libwebrtc APM (meson/ninja + abseil) so no system lib is required;
# see the `aec` feature note above for the host build prerequisites.
webrtc-audio-processing = { version = "2.1", features = [
    "bundled",
], optional = true }

[dev-dependencies]
tokio = { version = "1.34", features = ["test-util"] }
