[package]
name = "anamanti_protocol"
version = "0.1.0"
edition = "2021"
description = "The Wyoming wire protocol shared by the Anamanti Core (Mac) and the Anamanti Display device engine"
publish = false

# Kept deliberately minimal: this crate is a path dependency of both
# `anamanti-core` and the device engine (`anamanti-display/rust`, cross-compiled by
# cargokit for 32-bit armv7 Android). Pure Rust only, no native deps, and the same
# major versions both crates already resolve so nothing new enters either lockfile.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.34", features = ["io-util"] }

[dev-dependencies]
tokio = { version = "1.34", features = ["io-util", "macros", "rt"] }
