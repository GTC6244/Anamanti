[package]
name = "rust_lib_ambient_display"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
anyhow = "1.0.104"
cpal = "0.18.2"
flutter_rust_bridge = "=2.11.1"
log = "0.4.34"
mdns-sd = "0.11"
ringbuf = "0.5.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# In-app updater (plans/UpdaterPlan.md): a blocking HTTPS client +
# incremental SHA-256 for fetching latest.json and streaming the signed APK from
# Cloudflare R2. ureq's `tls` feature pins the rustls+`ring` provider and bundles
# Mozilla roots (webpki-roots) — deliberately NOT reqwest/native-tls, which drag in
# aws-lc-rs/OpenSSL and don't reliably cross-compile for 32-bit armv7 Android.
# `default-features = false` drops gzip (an APK is already compressed). sha2 reuses
# the `digest 0.10` already in Cargo.lock.
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
tokio = { version = "1.34", features = [
    "rt",
    "rt-multi-thread",
    "net",
    "io-util",
    "sync",
    "time",
    "macros",
] }
tract-onnx = "0.23.7"

# Android: initialize `ndk_context` (JavaVM + Application context) from `JNI_OnLoad`
# so cpal's AAudio output path can query the Java `AudioManager`. Without it,
# `start_playback` panics ("android context was not initialized") and TTS is silent.
# Versions pinned to what cpal already resolves, so no new crates are pulled in.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
ndk-context = "0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
