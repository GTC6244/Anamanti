[package]
name = "rust_lib_anamanti_companion"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
# The Wyoming wire protocol, shared with anamanti-core and anamanti-display so no
# side can drift. cargokit builds this crate in place via --manifest-path, so the
# path outside rust/ resolves.
anamanti_protocol = { path = "../../anamanti-protocol" }
anyhow = "1"
flutter_rust_bridge = "=2.11.1"
# mDNS browse of `_wyoming._tcp` (role=core), the same crate + major version the
# Display already cross-compiles for Android.
mdns-sd = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.34", features = [
    "rt",
    "rt-multi-thread",
    "net",
    "io-util",
    "time",
    "macros",
] }
# The companion HTTP API is plain HTTP on the home LAN (GET-only, no auth), so the
# client needs no TLS: `default-features = false` keeps rustls/ring/gzip out and the
# crate trivially cross-compilable for Android + iOS.
ureq = { version = "2.12", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
